# Stages a release on npm when a version tag (v1.2.3) is pushed. Nothing goes
# live from here: npm holds the staged version until a maintainer approves it
# on npmjs.com with two-step login.
#
# No npm token exists. npm trusts this workflow file in this repository
# (trusted publishing), and the "npm" environment only accepts v* tags.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # proves this workflow's identity to npm; no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports staged publishing
        run: npm install --global --ignore-scripts npm@12.2.2
      - run: npm ci --ignore-scripts
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm run ci
      - name: Stage (a maintainer approves it on npmjs.com)
        run: npm stage publish --ignore-scripts
